- name: Configure local development environment
  hosts: localhost
  tasks:
    - name: Configure Git tools
      ansible.builtin.include_tasks: tasks/git.yml
      tags:
        - git
    - name: Configure Stow
      ansible.builtin.include_tasks: tasks/stow.yml
      tags:
        - stow
    - name: Configure terminal tools
      ansible.builtin.include_tasks: tasks/terminal.yml
      tags:
        - terminal
    - name: Configure Python
      ansible.builtin.include_tasks: tasks/python.yml
      tags:
        - python
    - name: Configure Go
      ansible.builtin.include_tasks: tasks/go.yml
      tags:
        - go
    - name: Configure Docker
      ansible.builtin.include_tasks: tasks/docker.yml
      tags:
        - docker
    - name: Configure VSCode
      ansible.builtin.include_tasks: tasks/vscode.yml
      tags:
        - vscode
    - name: Configure Neovim
      ansible.builtin.include_tasks: tasks/neovim.yml
      tags:
        - vim
    - name: Configure applications
      ansible.builtin.include_tasks: tasks/apps.yml
      tags:
        - apps
    - name: Configure Claude Code
      ansible.builtin.include_tasks: tasks/claude.yml
      tags:
        - claude
    - name: Configure Codex
      ansible.builtin.include_tasks: tasks/codex.yml
      tags:
        - codex
