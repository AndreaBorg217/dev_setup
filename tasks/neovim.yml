- name: Install vim
  community.general.homebrew:
    name: vim
    state: present
  tags:
    - "vim"

- name: Install fd
  community.general.homebrew:
    name: fd
    state: present
  tags:
    - "vim"

- name: Install ripgrep
  community.general.homebrew:
    name: ripgrep
    state: present
  tags:
    - "vim"

- name: Install tree-sitter CLI (required by nvim-treesitter's main branch)
  community.general.homebrew:
    name: tree-sitter-cli
    state: present
  tags:
    - "vim"

- name: Install Neovim nightly
  vars:
    neovim_release_architecture: >-
      {{ {'arm64': 'arm64', 'x86_64': 'x86_64'}[ansible_facts.architecture] }}
    neovim_install_directory: >-
      {{ ansible_facts.env.HOME }}/.local/opt/neovim/nightly
    neovim_archive: >-
      {{ ansible_facts.env.HOME }}/Library/Caches/neovim-nightly-{{ neovim_release_architecture }}.tar.gz
  tags:
    - "vim"
  block:
    - name: Create Neovim nightly installation directory
      ansible.builtin.file:
        path: "{{ neovim_install_directory }}"
        state: directory
        mode: "0755"

    # Nightly is a rolling release with no published shasum256.txt (unlike
    # tagged releases), so there is no checksum to pin or verify against;
    # force a fresh download each run to track the latest build. Pinned to
    # nightly (not a tagged release) because this config needs an inlay_hint
    # fix (neovim/neovim#40569) that has not landed in a tagged release yet.
    - name: Download Neovim nightly release
      ansible.builtin.get_url:
        url: >-
          https://github.com/neovim/neovim/releases/download/nightly/nvim-macos-{{ neovim_release_architecture }}.tar.gz
        dest: "{{ neovim_archive }}"
        mode: "0644"
        force: true
      register: neovim_nightly_download

    - name: Inspect installed Neovim nightly binary
      ansible.builtin.stat:
        path: "{{ neovim_install_directory }}/bin/nvim"
      register: neovim_nightly_binary

    - name: Extract Neovim nightly release
      ansible.builtin.command:
        argv:
          - /usr/bin/tar
          - -xzf
          - "{{ neovim_archive }}"
          - -C
          - "{{ neovim_install_directory }}"
          - --strip-components=1
      when: neovim_nightly_download.changed or not neovim_nightly_binary.stat.exists

    - name: Select Neovim nightly as the current binary
      ansible.builtin.file:
        src: "{{ neovim_install_directory }}"
        dest: "{{ ansible_facts.env.HOME }}/.local/opt/neovim/current"
        state: link

- name: Inspect existing Neovim config
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/.config/nvim"
    follow: false
  register: neovim_config
  tags:
    - "vim"

- name: Unstow separately linked Neovim files
  ansible.builtin.command:
    argv:
      - stow
      - --delete
      - --verbose=2
      - "--target={{ ansible_facts.env.HOME }}"
      - neovim
    chdir: "{{ ansible_facts.env.HOME }}/Documents/GitHub/dev_setup"
  register: unstow_neovim
  changed_when: unstow_neovim.stderr is search('UNLINK:')
  when: neovim_config.stat.exists and not neovim_config.stat.islnk
  tags:
    - "vim"

- name: Inspect unstowed Neovim config
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/.config/nvim"
    follow: false
  register: unstowed_neovim_config
  tags:
    - "vim"

- name: Remove stale Neovim package links
  ansible.builtin.command:
    argv:
      - find
      - "{{ ansible_facts.env.HOME }}/.config/nvim"
      - -type
      - l
      - -lname
      - "*Documents/GitHub/dev_setup/neovim/*"
      - -print
      - -delete
  register: remove_stale_neovim_links
  changed_when: remove_stale_neovim_links.stdout | length > 0
  when:
    - neovim_config.stat.exists
    - not neovim_config.stat.islnk
    - unstowed_neovim_config.stat.exists
  tags:
    - "vim"

- name: Remove empty Neovim config directories
  ansible.builtin.command:
    argv:
      - find
      - "{{ ansible_facts.env.HOME }}/.config/nvim"
      - -depth
      - -type
      - d
      - -empty
      - -print
      - -delete
  register: remove_empty_neovim_directories
  changed_when: remove_empty_neovim_directories.stdout | length > 0
  when:
    - neovim_config.stat.exists
    - not neovim_config.stat.islnk
    - unstowed_neovim_config.stat.exists
  tags:
    - "vim"

- name: Check Neovim config migration
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/.config/nvim"
    follow: false
  register: migrated_neovim_config
  tags:
    - "vim"

- name: Protect local Neovim config files
  ansible.builtin.assert:
    that: not migrated_neovim_config.stat.exists
    fail_msg: >-
      ~/.config/nvim contains files not managed by Stow. Move them before
      replacing the directory with a symlink.
  when:
    - neovim_config.stat.exists
    - not neovim_config.stat.islnk
    - not ansible_check_mode
  tags:
    - "vim"

- name: Stow Neovim config directory
  ansible.builtin.command:
    argv:
      - stow
      - --stow
      - --verbose=2
      - "--target={{ ansible_facts.env.HOME }}"
      - neovim
    chdir: "{{ ansible_facts.env.HOME }}/Documents/GitHub/dev_setup"
  register: stow_neovim
  changed_when: stow_neovim.stderr is search('LINK:')
  tags:
    - "vim"

- name: Inspect stowed Neovim config
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/.config/nvim"
    follow: false
  register: stowed_neovim_config
  tags:
    - "vim"

- name: Verify stowed Neovim config
  ansible.builtin.assert:
    that:
      - stowed_neovim_config.stat.islnk
      - >-
        stowed_neovim_config.stat.lnk_source ==
        ansible_facts.env.HOME + '/Documents/GitHub/dev_setup/neovim/.config/nvim'
    fail_msg: ~/.config/nvim is not linked to the managed Neovim config.
  tags:
    - "vim"
  when: not ansible_check_mode or neovim_config.stat.islnk
