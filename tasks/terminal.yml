- name: Install iTerm2
  homebrew_cask:
    name: iterm2
    state: present
  tags:
    - "terminal"

- name: Create user Fonts directory
  file:
    path: "{{ ansible_facts.env.HOME }}/Library/Fonts"
    state: directory
    mode: "0755"
  tags:
    - "terminal"

- name: Install MesloLGS Nerd Font
  copy:
    src: "{{ ansible_facts.env.HOME }}/Documents/GitHub/dev_setup/MesloLGS NF Regular.ttf"
    dest: "{{ ansible_facts.env.HOME }}/Library/Fonts/MesloLGS NF Regular.ttf"
    mode: "0644"
  tags:
    - "terminal"

- name: Create iTerm2 DynamicProfiles directory
  file:
    path: "{{ ansible_facts.env.HOME }}/Library/Application Support/iTerm2/DynamicProfiles"
    state: directory
    mode: "0755"
  tags:
    - "terminal"

- name: Install iTerm2 Dev Setup profile
  copy:
    src: "{{ ansible_facts.env.HOME }}/Documents/GitHub/dev_setup/iterm2/dev-setup.json"
    dest: "{{ ansible_facts.env.HOME }}/Library/Application Support/iTerm2/DynamicProfiles/dev-setup.json"
    mode: "0644"
  tags:
    - "terminal"

- name: Check iTerm2 default profile
  command: defaults read com.googlecode.iterm2 "Default Bookmark Guid"
  register: iterm_default_profile
  changed_when: false
  failed_when: false
  tags:
    - "terminal"

- name: Set iTerm2 Dev Setup as the default profile
  command: defaults write com.googlecode.iterm2 "Default Bookmark Guid" -string "EC1F54A1-BF6E-4C63-9F60-0E75E7950001"
  changed_when: true
  when: iterm_default_profile.stdout != "EC1F54A1-BF6E-4C63-9F60-0E75E7950001"
  tags:
    - "terminal"

- name: Stow zsh dotfiles
  shell: |
    cd "{{ ansible_facts.env.HOME }}/Documents/GitHub/dev_setup"
    stow --restow --verbose=2 --target="{{ ansible_facts.env.HOME }}" terminal
  register: stow_terminal
  changed_when: stow_terminal.stderr is search('LINK')
  tags:
    - "terminal"

# ============================================================================
# OH MY ZSH
# ============================================================================

- name: Check if Oh My Zsh is already installed
  stat:
    path: "{{ ansible_facts.env.HOME }}/.oh-my-zsh"
  register: omz_installed
  tags:
    - "terminal"

- name: Install Oh My Zsh
  shell: |
    sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"
  environment:
    RUNZSH: "no"
    KEEP_ZSHRC: "yes"
  when: not omz_installed.stat.exists
  tags:
    - "terminal"

# ============================================================================
# POWERLEVEL10K
# ============================================================================

- name: Check if Powerlevel10k is already installed
  stat:
    path: "{{ ansible_facts.env.HOME }}/.oh-my-zsh/custom/themes/powerlevel10k"
  register: p10k_installed
  tags:
    - "terminal"

- name: Install Powerlevel10k theme
  git:
    repo: https://github.com/romkatv/powerlevel10k.git
    dest: "{{ ansible_facts.env.HOME }}/.oh-my-zsh/custom/themes/powerlevel10k"
    depth: 1
  when: not p10k_installed.stat.exists
  tags:
    - "terminal"

# ============================================================================
# ZSH PLUGINS
# ============================================================================

- name: Check if zsh-autosuggestions is already installed
  stat:
    path: "{{ ansible_facts.env.HOME }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
  register: autosuggestions_installed
  tags:
    - "terminal"

- name: Install zsh-autosuggestions
  git:
    repo: https://github.com/zsh-users/zsh-autosuggestions
    dest: "{{ ansible_facts.env.HOME }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
  when: not autosuggestions_installed.stat.exists
  tags:
    - "terminal"

- name: Check if zsh-syntax-highlighting is already installed
  stat:
    path: "{{ ansible_facts.env.HOME }}/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"
  register: syntax_highlighting_installed
  tags:
    - "terminal"

- name: Install zsh-syntax-highlighting
  git:
    repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
    dest: "{{ ansible_facts.env.HOME }}/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"
  when: not syntax_highlighting_installed.stat.exists
  tags:
    - "terminal"

# ============================================================================
# TMUX
# ============================================================================

- name: Install tmux
  homebrew:
    name: tmux
    state: present
  tags:
    - "terminal"

- name: Check if tmux plugin manager is already installed
  stat:
    path: "{{ ansible_facts.env.HOME }}/.tmux/plugins/tpm"
  register: tpm_installed
  tags:
    - "terminal"

- name: Install tmux plugin manager (tpm)
  git:
    repo: https://github.com/tmux-plugins/tpm
    dest: "{{ ansible_facts.env.HOME }}/.tmux/plugins/tpm"
  when: not tpm_installed.stat.exists
  tags:
    - "terminal"

- name: Stow tmux dotfiles
  shell: |
    cd "{{ ansible_facts.env.HOME }}/Documents/GitHub/dev_setup"
    stow --restow --verbose=2 --target="{{ ansible_facts.env.HOME }}" tmux
  register: stow_tmux
  changed_when: stow_tmux.stderr is search('LINK')
  tags:
    - "terminal"

- name: Install tmux plugins
  command: "{{ ansible_facts.env.HOME }}/.tmux/plugins/tpm/bin/install_plugins"
  register: tmux_plugins_install
  changed_when: tmux_plugins_install.stdout is search('Installing') or tmux_plugins_install.stderr is search('Installing')
  tags:
    - "terminal"
