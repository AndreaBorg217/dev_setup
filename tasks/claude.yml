- name: Install node
  community.general.homebrew:
    name: node
    state: present
  tags:
    - "claude"

- name: Install Claude Code
  community.general.homebrew:
    name: claude-code
    state: present
  tags:
    - "claude"

- name: Install caveman-code
  community.general.npm:
    name: "@juliusbrussee/caveman-code"
    global: true
    state: present
  tags:
    - "claude"

- name: Install rtk
  community.general.homebrew:
    name: rtk
    state: present
  tags:
    - "claude"

- name: List Claude plugin marketplaces
  ansible.builtin.command:
    argv:
      - claude
      - plugin
      - marketplace
      - list
      - --json
  register: claude_marketplaces
  check_mode: false
  changed_when: false
  tags:
    - "claude"

- name: Add caveman plugin marketplace
  ansible.builtin.command:
    argv:
      - claude
      - plugin
      - marketplace
      - add
      - JuliusBrussee/caveman
  changed_when: true
  when: "'caveman' not in (claude_marketplaces.stdout | from_json | map(attribute='name') | list)"
  tags:
    - "claude"

- name: List Claude plugins
  ansible.builtin.command:
    argv:
      - claude
      - plugin
      - list
      - --json
  register: claude_plugins
  check_mode: false
  changed_when: false
  tags:
    - "claude"

- name: Install caveman plugin
  ansible.builtin.command:
    argv:
      - claude
      - plugin
      - install
      - caveman@caveman
  changed_when: true
  when: "'caveman@caveman' not in (claude_plugins.stdout | from_json | map(attribute='id') | list)"
  tags:
    - "claude"

- name: Initialize rtk globally
  ansible.builtin.command:
    argv:
      - rtk
      - init
      - --global
  changed_when: false
  tags:
    - "claude"

- name: Check Claude config path
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/.claude"
    follow: false
  register: claude_config_path
  tags:
    - "claude"

- name: Fail when Claude config path is an unmanaged symlink
  ansible.builtin.fail:
    msg: >-
      ~/.claude links outside this repository. Replace it manually before
      running this task.
  when:
    - claude_config_path.stat.islnk | default(false)
    - claude_config_path.stat.lnk_source != playbook_dir + '/.claude'
  tags:
    - "claude"

- name: Remove legacy managed Claude config symlink
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.claude"
    state: absent
  when:
    - claude_config_path.stat.islnk | default(false)
    - claude_config_path.stat.lnk_source == playbook_dir + '/.claude'
  tags:
    - "claude"

- name: Create Claude config directory
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.claude"
    state: directory
    mode: "0755"
  tags:
    - "claude"

- name: Symlink Claude config files
  ansible.builtin.file:
    src: "{{ playbook_dir }}/.claude/{{ item }}"
    dest: "{{ ansible_facts.env.HOME }}/.claude/{{ item }}"
    state: link
    force: true
  loop:
    - .gitignore
    - CLAUDE.md
    - settings.json
    - statusline.sh
  when: not (ansible_check_mode and claude_config_path.stat.islnk)
  tags:
    - "claude"

- name: Check Claude config directories
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/.claude/{{ item }}"
  loop:
    - agents
    - commands
    - hooks
    - output-styles
    - rules
    - scripts
    - skills
    - themes
    - workflows
  register: claude_config_dirs
  tags:
    - "claude"

- name: Symlink Claude config directories
  ansible.builtin.file:
    src: "{{ item.stat.path }}"
    dest: "{{ ansible_facts.env.HOME }}/.claude/{{ item.item }}"
    state: link
  tags:
    - "claude"
  loop: "{{ claude_config_dirs.results }}"
  when:
    - item.stat.isdir | default(false)
    - not (ansible_check_mode and claude_config_path.stat.islnk)
