- name: Install Claude Homebrew formulae
  community.general.homebrew:
    name:
      - node
      - jdtls
      - pyright
      - gopls
    state: present

- name: Install stable Claude Code
  community.general.homebrew_cask:
    name: claude-code
    state: present

- name: Create CodeGraph installer cache directory
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.cache/dev_setup"
    state: directory
    mode: "0700"

- name: Download latest CodeGraph standalone installer
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/colbymchenry/codegraph/main/install.sh
    dest: "{{ ansible_facts.env.HOME }}/.cache/dev_setup/codegraph-install.sh"
    mode: "0700"
    force: true
  when: not ansible_check_mode

- name: Install latest CodeGraph standalone bundle
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.env.HOME }}/.cache/dev_setup/codegraph-install.sh"
  when: not ansible_check_mode
  changed_when: true

- name: Verify CodeGraph installation
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.env.HOME }}/.local/bin/codegraph"
      - --version
  when: not ansible_check_mode
  changed_when: false

- name: Read Claude CodeGraph MCP registration
  ansible.builtin.command:
    argv:
      - claude
      - mcp
      - get
      - codegraph
  register: claude_codegraph_mcp
  check_mode: false
  changed_when: false
  failed_when: false

- name: Register CodeGraph MCP with Claude
  ansible.builtin.command:
    argv:
      - claude
      - mcp
      - add
      - --scope
      - user
      - codegraph
      - --
      - codegraph
      - serve
      - --mcp
  when:
    - not ansible_check_mode
    - claude_codegraph_mcp.rc != 0
  changed_when: true

- name: Create Claude config directory
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.claude"
    state: directory
    mode: "0755"

- name: Link managed Claude configuration
  ansible.builtin.file:
    src: "{{ playbook_dir }}/.claude/{{ item.source }}"
    dest: "{{ ansible_facts.env.HOME }}/.claude/{{ item.target }}"
    state: link
    force: true
  loop:
    - source: .gitignore
      target: .gitignore
    - source: CLAUDE.md
      target: CLAUDE.md
    - source: settings.json
      target: settings.json
    - source: statusline.sh
      target: statusline.sh
    - source: agents
      target: agents
    - source: output-styles
      target: output-styles
    - source: rules
      target: rules
    - source: scripts
      target: scripts
    - source: skills
      target: skills
  loop_control:
    label: "{{ item.target }}"

- name: Add Context Mode marketplace
  ansible.builtin.command:
    argv:
      - claude
      - plugin
      - marketplace
      - add
      - mksglu/context-mode
  register: context_mode_marketplace
  when: not ansible_check_mode
  changed_when: "'Successfully added marketplace' in context_mode_marketplace.stdout"

- name: Install Context Mode plugin
  ansible.builtin.command:
    argv:
      - claude
      - plugin
      - install
      - context-mode@context-mode
  register: context_mode_install
  when: not ansible_check_mode
  changed_when: "'already installed' not in context_mode_install.stdout"

- name: Add official Claude plugin marketplace
  ansible.builtin.command:
    argv:
      - claude
      - plugin
      - marketplace
      - add
      - anthropics/claude-plugins-official
  register: claude_official_marketplace
  when: not ansible_check_mode
  changed_when: >-
    'Successfully added marketplace' in claude_official_marketplace.stdout

- name: Read installed Claude plugins
  ansible.builtin.command:
    argv:
      - claude
      - plugin
      - list
      - --json
  register: claude_plugins
  check_mode: false
  changed_when: false

- name: Install missing Claude plugins
  ansible.builtin.command:
    argv:
      - claude
      - plugin
      - install
      - "{{ item }}"
  loop:
    - jdtls-lsp@claude-plugins-official
    - pyright-lsp@claude-plugins-official
    - gopls-lsp@claude-plugins-official
    - skill-creator@claude-plugins-official
  when:
    - not ansible_check_mode
    - >-
      item not in
      (claude_plugins.stdout | from_json |
       selectattr('scope', 'equalto', 'user') |
       map(attribute='id') | list)
  changed_when: true
